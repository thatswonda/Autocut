[project]
name = "autoedit-render"
version = "0.1.0"
description = "Edit rendering: EDL -> FFmpeg (cuts, reframing, color grades, loudness, intro/outro clips)"
requires-python = ">=3.11"
dependencies = ["autoedit-schemas", "autoedit-pipeline"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autoedit_render"]
