[project]
name = "autoedit-schemas"
version = "0.1.0"
description = "Single source of truth for AutoEdit data contracts: EDL, Composition, signals, media info"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autoedit_schemas"]
