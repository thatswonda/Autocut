[project]
name = "autoedit-motion"
version = "0.1.0"
description = "Motion graphics: style presets, HTML scene templates, frame-stepped renderer, storyboard generation"
requires-python = ">=3.11"
dependencies = [
    "autoedit-schemas",
    "autoedit-brand",
    "playwright>=1.48",
    "anthropic>=0.70",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autoedit_motion"]
