# Local development stack: docker compose -f infra/docker-compose.yml up --build
name: autoedit

x-app: &app
  build:
    context: ..
    dockerfile: infra/Dockerfile
  image: autoedit:dev
  env_file:
    - path: ../.env
      required: false
  environment: &app-env
    AUTOEDIT_ENV: dev
    AUTOEDIT_DATABASE_URL: postgresql+psycopg://autoedit:autoedit@postgres:5432/autoedit
    AUTOEDIT_REDIS_URL: redis://redis:6379/0
    AUTOEDIT_STORAGE_BACKEND: s3
    AUTOEDIT_S3_ENDPOINT_URL: http://minio:9000
    AUTOEDIT_S3_BUCKET: autoedit
    AUTOEDIT_S3_REGION: us-east-1
    AUTOEDIT_S3_ACCESS_KEY_ID: autoedit
    AUTOEDIT_S3_SECRET_ACCESS_KEY: autoedit-dev-secret
    AUTOEDIT_S3_SERVER_SIDE_ENCRYPTION: "false" # MinIO needs KMS for SSE; R2/S3 encrypt by default
  volumes:
    - staging:/data
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
    minio-init: { condition: service_completed_successfully }

services:
  api:
    <<: *app
    ports: ["8000:8000"]

  worker:
    <<: *app
    command: ["python", "-m", "autoedit_api.manage", "worker"]
    healthcheck: { disable: true }
    depends_on:
      api: { condition: service_healthy } # api runs the migrations

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: autoedit
      POSTGRES_PASSWORD: autoedit
      POSTGRES_DB: autoedit
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autoedit"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: autoedit
      MINIO_ROOT_PASSWORD: autoedit-dev-secret
    volumes: [miniodata:/data]
    ports: ["9000:9000", "9001:9001"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      retries: 20

  minio-init:
    image: minio/mc:RELEASE.2024-11-21T17-21-54Z
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      sh -c "mc alias set local http://minio:9000 autoedit autoedit-dev-secret &&
             mc mb --ignore-existing local/autoedit"

volumes:
  pgdata:
  miniodata:
  staging:
