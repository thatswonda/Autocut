[project]
name = "autoedit-workspace"
version = "0.1.0"
description = "AutoEdit monorepo: AI video editor and motion graphics creator"
requires-python = ">=3.11"
dependencies = [
    "autoedit-schemas",
    "autoedit-pipeline",
    "autoedit-api",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "httpx>=0.27",
    "fakeredis>=2.26",
    "types-redis",
    "boto3-stubs[s3]",
    "moto[s3]>=5.0",
]

[tool.uv]
package = false
# MediaPipe wants opencv-contrib-python and PySceneDetect wants opencv-python. Both ship the same `cv2`
# module (and GUI libraries a server does not need), so collapse them onto one headless contrib build.
override-dependencies = [
    "opencv-python; sys_platform == 'never'",
    "opencv-contrib-python; sys_platform == 'never'",
    "opencv-python-headless; sys_platform == 'never'",
]

[tool.uv.workspace]
members = ["packages/schemas", "packages/pipeline", "apps/api"]

[tool.uv.sources]
autoedit-schemas = { workspace = true }
autoedit-pipeline = { workspace = true }
autoedit-api = { workspace = true }

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["apps/api/alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "C4", "PTH", "RET"]
# E501: the formatter owns line length; the only long lines are hand-aligned `fmt: skip` tables.
ignore = ["RUF012", "B008", "N818", "E501"]

[tool.ruff.lint.per-file-ignores]
"**/cli.py" = ["RUF001"]  # en dash and multiplication sign are deliberate in terminal tables

[tool.ruff.lint.isort]
known-first-party = ["autoedit_schemas", "autoedit_pipeline", "autoedit_api"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
disallow_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
ignore_missing_imports = true
mypy_path = ["packages/schemas/src", "packages/pipeline/src", "apps/api/src"]
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["packages/schemas/tests", "packages/pipeline/tests", "apps/api/tests"]
addopts = "-ra --import-mode=importlib"
markers = [
    "slow: exercises real media decoding (still runs in CI, a few seconds each)",
    "integration: needs live Postgres and Redis (AUTOEDIT_IT_DATABASE_URL / AUTOEDIT_IT_REDIS_URL)",
]
