[project]
name = "autoedit-api"
version = "0.1.0"
description = "AutoEdit HTTP API and background worker"
requires-python = ">=3.11"
dependencies = [
    "autoedit-schemas",
    "autoedit-pipeline",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "redis>=5.2",
    "rq>=2.0",
    "boto3>=1.35",
    "structlog>=24.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autoedit_api"]
